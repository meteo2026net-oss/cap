name: Bootstrap dependency lockfile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cap-lockfile-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate, verify, test, and commit the lockfile if missing
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            echo "package-lock.json already exists; no bootstrap is needed."
            exit 0
          fi

          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --lockfile-version=3

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (lock.lockfileVersion !== 3) throw new Error(`Expected lockfileVersion 3, got ${lock.lockfileVersion}`);
          if (lock.name !== manifest.name || lock.version !== manifest.version) throw new Error('Lockfile root package identity does not match package.json');
          const sort = value => JSON.stringify(value, Object.keys(value || {}).sort());
          if (sort(lock.packages[''].dependencies) !== sort(manifest.dependencies)) throw new Error('Lockfile root dependencies differ from package.json');
          console.log(`Verified npm lockfile v${lock.lockfileVersion} with ${Object.keys(lock.packages || {}).length} package entries.`);
          NODE

          npm ci --no-audit --no-fund
          npm test
          npm audit --audit-level=low

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && { echo "No lockfile changes to commit."; exit 0; }
          git commit -m "build: add reproducible npm dependency lockfile"
          git push origin HEAD:main
