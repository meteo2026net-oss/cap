name: CAP system checks

permissions:
  contents: read

concurrency:
  group: cap-system-checks-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify Node.js version policy is consistent
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import packageJson from "./package.json" with { type: "json" };
            const engines = packageJson.engines;
            const workflow = fs.readFileSync(".github/workflows/test.yml", "utf8");
            const setup = fs.readFileSync("scripts/setup-local.mjs", "utf8");
            const setupPs1 = fs.readFileSync("scripts/setup-local.ps1", "utf8");
            const startBat = fs.readFileSync("start-local.bat", "utf8");
            const nvmrc = fs.readFileSync(".nvmrc", "utf8").trim();
            const expected = "22";
            if (engines.node !== ">=22" || nvmrc !== expected ||
                !workflow.includes("node-version: 22") ||
                !setup.includes("nodeMajor < 22") ||
                !setup.includes("Node.js 22 or newer") ||
                !setupPs1.includes("$nodeMajor -lt 22") || !setupPs1.includes("npm ci") ||
                !setupPs1.includes("$mfaBytes = New-Object byte[] 32") ||
                !setupPs1.includes("MFA_ENCRYPTION_KEY=$mfaEncryptionKey") ||
                !setupPs1.includes("npm ci") ||
                !startBat.includes("LSS 22") || !startBat.includes("where npm") ||
                !startBat.includes("call npm ci") ||
                startBat.toLowerCase().includes('if not exist "node_modules"')) {
              throw new Error("Node.js policy or Windows dependency-bootstrap behavior differs from the tested setup contract");
            }
            console.log("Node.js 22 policy and reproducible Windows dependency bootstrap are consistent across package, local pin, setup scripts, and CI.");
          '
      - name: Install XML schema validator
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
      - name: Download official OASIS CAP 1.2 schema
        run: |
          mkdir -p schemas
          curl --fail --silent --show-error --location https://docs.oasis-open.org/emergency/cap/v1.2/CAP-v1.2.xsd -o schemas/CAP-v1.2.xsd
      - name: Install exact dependency versions from package-lock.json
        run: npm ci --no-audit --no-fund
      - name: Report dependency vulnerabilities
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,via:v.via,fixAvailable:v.fixAvailable})); const totals=a.metadata?.vulnerabilities||{}; console.log('Total vulnerabilities: '+JSON.stringify(totals)); if((totals.total||0)>0) process.exit(1)"
      - name: Check JavaScript syntax
        run: |
          node --check scripts/setup-local.mjs
          node --check src/webhook-signature.js
          node --check src/webhook-replay.js
          node --check tests/webhook-replay.test.js
          node --check tests/webhook-signature.test.js
          node --check src/delivery-worker.js
          node --check src/server.js
          node --check src/db.js
          node --check src/lease-migration.js
          node --check tests/lease-migration.test.js
          node --check src/cap.js
          node --check src/geojson.js
          node --check src/audit.js
          node --check src/backup-utils.js
          node --check src/backup.js
          node --check src/restore.js
          node --check tests/backup.test.js
          node --check tests/delivery.test.js
          node --check public/geojson-validation.js
          node --check public/app.js
          node --check tests/cap.test.js
          node --check tests/cap-schema.test.js
          node --check tests/geojson.test.js
          node --check tests/geojson-import.test.js
          node --check tests/audit.test.js
          node --check tests/api.integration.test.js
      - run: npm test
      - run: npm run test:cap-schema
