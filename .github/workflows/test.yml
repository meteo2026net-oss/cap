name: CAP system checks

permissions:
  contents: read

concurrency:
  group: cap-system-checks-${{ github.ref }}
  # Preserve the full Linux and Windows test matrix when successive commits are pushed.
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Verify Node.js version policy is consistent
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import packageJson from "./package.json" with { type: "json" };
            const engines = packageJson.engines;
            const workflow = fs.readFileSync(".github/workflows/test.yml", "utf8");
            const setup = fs.readFileSync("scripts/setup-local.mjs", "utf8");
            const setupPs1 = fs.readFileSync("scripts/setup-local.ps1", "utf8");
            const startBat = fs.readFileSync("start-local.bat", "utf8");
            const nvmrc = fs.readFileSync(".nvmrc", "utf8").trim();
            const expected = "22";
            if (engines.node !== ">=22" || nvmrc !== expected ||
                !workflow.includes("node-version: 22") ||
                !setup.includes("nodeMajor < 22") ||
                !setup.includes("Node.js 22 or newer") ||
                !setupPs1.includes("$nodeMajor -lt 22") || !setupPs1.includes("npm ci") ||
                !setupPs1.includes("$mfaBytes = New-Object byte[] 32") ||
                !setupPs1.includes("MFA_ENCRYPTION_KEY=$mfaEncryptionKey") ||
                !setupPs1.includes("npm ci") ||
                !startBat.includes("LSS 22") || !startBat.includes("where npm") ||
                !startBat.includes("call npm ci") ||
                startBat.toLowerCase().includes("if not exist \"node_modules\"")) {
              throw new Error("Node.js policy or Windows dependency-bootstrap behavior differs from the tested setup contract");
            }
            console.log("Node.js 22 policy and reproducible Windows dependency bootstrap are consistent across package, local pin, setup scripts, and CI.");
          '
      - name: Enforce direct Node.js and SQLite deployment (no Docker)
        run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            const tracked = execFileSync("git", ["ls-files", "-z"], { encoding: "utf8" }).split("\\0").filter(Boolean);
            const forbidden = tracked.filter((file) => {
              const name = file.split("/").at(-1);
              return /^Dockerfile(?:\\..*)?$/i.test(name) ||
                /^(?:docker-compose|compose)(?:\\..*)?\\.(?:yml|yaml)$/i.test(name) ||
                name.toLowerCase() === ".dockerignore";
            });
            if (forbidden.length) throw new Error("Docker artifacts are not permitted anywhere in the repository: " + forbidden.join(", "));
            console.log("Direct host deployment policy verified across all tracked repository paths: no Docker or Compose artifacts.");
          '
      - name: Install XML schema validator
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
      - name: Download official OASIS CAP 1.2 schema
        run: |
          mkdir -p schemas
          curl --fail --silent --show-error --location https://docs.oasis-open.org/emergency/cap/v1.2/CAP-v1.2.xsd -o schemas/CAP-v1.2.xsd
      - name: Install exact dependency versions from package-lock.json
        run: npm ci --no-audit --no-fund
      - name: Report dependency vulnerabilities
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,via:v.via,fixAvailable:v.fixAvailable})); const totals=a.metadata?.vulnerabilities||{}; console.log('Total vulnerabilities: '+JSON.stringify(totals)); if((totals.total||0)>0) process.exit(1)"
      - name: Check syntax of every tracked JavaScript file
        shell: bash
        run: |
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(git ls-files -z -- '*.js' '*.mjs')
          if [ "$count" -eq 0 ]; then
            echo "No tracked JavaScript files were checked."
            exit 1
          fi
          echo "Syntax checks passed for $count tracked JavaScript files."
      - run: npm test
      - name: Run 10,000-message CAP performance benchmark
        run: npm run perf:10k
      - run: npm run test:cap-schema

  windows-backup:
    # Pin to the stable VS 2022 image; windows-latest moved to VS 2026,
    # which node-gyp currently fails to detect for better-sqlite3 native builds.
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Install exact dependency versions
        run: npm ci --no-audit --no-fund
      - name: Test configured backup and restore CLIs on Windows
        run: node --test tests/backup-cli.test.js
      - name: Parse Windows PowerShell backup scripts
        shell: pwsh
        run: |
          $files = @(
            "scripts/run-backup.ps1",
            "scripts/install-daily-backup.ps1",
            "scripts/remove-daily-backup.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax validation failed: $file"
            }
          }
          Write-Output "All Windows backup PowerShell scripts parsed successfully."
