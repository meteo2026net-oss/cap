name: CAP system checks

permissions:
  contents: read

concurrency:
  group: cap-system-checks-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install XML schema validator
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
      - name: Download official OASIS CAP 1.2 schema
        run: |
          mkdir -p schemas
          curl --fail --silent --show-error --location https://docs.oasis-open.org/emergency/cap/v1.2/CAP-v1.2.xsd -o schemas/CAP-v1.2.xsd
      - run: npm install --no-audit --no-fund
      - name: Report dependency vulnerabilities
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,via:v.via,fixAvailable:v.fixAvailable})); const totals=a.metadata?.vulnerabilities||{}; console.log('Total vulnerabilities: '+JSON.stringify(totals)); if((totals.total||0)>0) process.exit(1)"
      - name: Check JavaScript syntax
        run: |
          node --check scripts/setup-local.mjs
          node --check src/webhook-signature.js
          node --check src/webhook-replay.js
          node --check tests/webhook-replay.test.js
          node --check tests/webhook-signature.test.js
          node --check src/delivery-worker.js
          node --check src/server.js
          node --check src/db.js
          node --check src/lease-migration.js
          node --check tests/lease-migration.test.js
          node --check src/cap.js
          node --check src/geojson.js
          node --check src/audit.js
          node --check src/backup-utils.js
          node --check src/backup.js
          node --check src/restore.js
          node --check tests/backup.test.js
          node --check tests/delivery.test.js
          node --check public/geojson-validation.js
          node --check public/app.js
          node --check tests/cap.test.js
          node --check tests/cap-schema.test.js
          node --check tests/geojson.test.js
          node --check tests/geojson-import.test.js
          node --check tests/audit.test.js
          node --check tests/api.integration.test.js
      - run: npm test
      - run: npm run test:cap-schema
      - name: Validate hardened Compose configuration
        run: |
          set -eu
          printf '%s\n' 'ADMIN_PASSWORD=CI-Compose-Validation-Password-2026' 'JWT_SECRET=ci-compose-validation-secret-at-least-32-characters-long' > .env
          docker compose config --quiet
          rm -f .env
      - name: Build production Docker image
        run: docker build --pull -t meteo-cap-warning-system:ci .
      - name: Smoke test Docker container and backup/restore
        run: |
          set -eu
          docker run -d --name cap-smoke -p 127.0.0.1:18095:8095 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 100 \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            -v cap-smoke-data:/app/storage \
            -v cap-smoke-backups:/app/backups \
            -e JWT_SECRET=ci-smoke-test-secret-at-least-32-characters-long \
            -e ADMIN_PASSWORD=CI-Smoke-Test-Admin-Password-2026 \
            meteo-cap-warning-system:ci
          trap 'docker logs cap-smoke || true; docker rm -f cap-smoke || true' EXIT
          healthy=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18095/api/health; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "$healthy" != true ]; then
            echo "Container did not become healthy."
            docker logs cap-smoke
            exit 1
          fi
          echo "Container health endpoint passed."

          backup_output="$(docker exec cap-smoke node src/backup.js)"
          backup_name="$(printf '%s' "$backup_output" | node -e 'let input="";process.stdin.on("data",chunk=>input+=chunk);process.stdin.on("end",()=>{const result=JSON.parse(input);if(!result.ok||typeof result.backup!=="string")process.exit(1);console.log(require("node:path").basename(result.backup));});')"
          test -n "$backup_name"
          echo "Created and validated backup: $backup_name"

          docker stop cap-smoke
          docker run --rm --volumes-from cap-smoke \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 100 \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            meteo-cap-warning-system:ci \
            node src/restore.js "/app/backups/$backup_name" --force
          echo "Restore command completed against the stopped container's persistent volumes."

          docker start cap-smoke
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18095/api/health; then
              echo "Container became healthy after restore."
              exit 0
            fi
            sleep 2
          done
          echo "Container did not recover after backup/restore."
          docker logs cap-smoke
          exit 1
