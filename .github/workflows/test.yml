name: CAP system checks

concurrency:
  group: cap-system-checks-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install XML schema validator
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
      - name: Download official OASIS CAP 1.2 schema
        run: |
          mkdir -p schemas
          curl --fail --silent --show-error --location https://docs.oasis-open.org/emergency/cap/v1.2/CAP-v1.2.xsd -o schemas/CAP-v1.2.xsd
      - run: npm install --no-audit --no-fund
      - name: Report dependency vulnerabilities
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,via:v.via,fixAvailable:v.fixAvailable})); console.log('Total vulnerabilities: '+JSON.stringify(a.metadata?.vulnerabilities||{}))"
      - name: Check JavaScript syntax
        run: |
          node --check src/server.js
          node --check src/db.js
          node --check src/cap.js
          node --check src/geojson.js
          node --check src/audit.js
          node --check public/geojson-validation.js
          node --check public/app.js
          node --check tests/cap.test.js
          node --check tests/cap-schema.test.js
          node --check tests/geojson.test.js
          node --check tests/geojson-import.test.js
          node --check tests/audit.test.js
          node --check tests/api.integration.test.js
      - run: npm test
      - run: npm run test:cap-schema
      - name: Build production Docker image
        run: docker build --pull -t meteo-cap-warning-system:ci .
      - name: Smoke test Docker container
        run: |
          docker run -d --name cap-smoke -p 127.0.0.1:18095:8095 \
            -e JWT_SECRET=ci-smoke-test-secret-at-least-32-characters-long \
            -e ADMIN_PASSWORD=CI-Smoke-Test-Admin-Password-2026 \
            meteo-cap-warning-system:ci
          trap 'docker logs cap-smoke || true; docker rm -f cap-smoke || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18095/api/health; then
              echo "Container health endpoint passed."
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy."
          docker logs cap-smoke
          exit 1
