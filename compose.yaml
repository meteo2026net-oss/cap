services:
  cap:
    build:
      context: .
      dockerfile: Dockerfile
    image: meteo-cap-warning-system:latest
    container_name: meteo-cap-warning-system
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CAP_PORT:-8095}:8095"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8095
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CAP_SENDER: ${CAP_SENDER:-alerts@example.org}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      BACKUP_DIR: /app/backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - cap-data:/app/storage
      - cap-backups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8095/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  delivery-worker:
    image: meteo-cap-warning-system:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meteo-cap-delivery-worker
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    profiles: ["worker"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      CAP_DELIVERY_WORKER_INTERVAL_MS: ${CAP_DELIVERY_WORKER_INTERVAL_MS:-30000}
    command: ["node", "src/delivery-worker.js"]
    volumes:
      - cap-data:/app/storage
      - cap-backups:/app/backups
    depends_on:
      cap:
        condition: service_healthy

volumes:
  cap-data:
  cap-backups:
