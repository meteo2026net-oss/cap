services:
  cap:
    build:
      context: .
      dockerfile: Dockerfile
    image: meteo-cap-warning-system:latest
    container_name: meteo-cap-warning-system
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CAP_PORT:-8095}:8095"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8095
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CAP_SENDER: ${CAP_SENDER:-alerts@example.org}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - cap-data:/app/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8095/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  cap-data:
